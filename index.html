<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>T8 Shop</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- header start -->
    <header class="site-header">
      <div class="wrap wrap--header header">
        <a class="logo" href="index.html">LOGO</a>

        <nav class="mainnav">
          <ul>
            <li><a href="productlist.html">Accessories</a></li>
            <li><a href="productlist.html">Apparel</a></li>
            <li><a href="productlist.html">Footwear</a></li>
            <li><a href="productlist.html">Free Items</a></li>
            <li><a href="productlist.html">Personal Care</a></li>
            <li><a href="productlist.html">Sporting Goods</a></li>
          </ul>
        </nav>

        <div class="header-actions">
          <label class="search"><input placeholder="Search" /></label>
          <span class="iconbtn"
            ><img
              src="img/icons/profile-user-avatar-man-person-svgrepo-com.svg"
              alt="Profile"
          /></span>
          <span class="iconbtn"
            ><img src="img/icons/heart-svgrepo-com-kopi.svg" alt="Favoritter"
          /></span>
          <span class="iconbtn"
            ><img
              src="img/icons/shopping-bag-svgrepo-com.svg"
              alt="Shopping bag"
          /></span>
        </div>
      </div>
      <div class="accent-line"></div>
    </header>
    <!-- header slut -->
    <main class="wrap">
      <section class="category-grid">
        <a class="tile" href="productlist.html">
          <img src="img/forsiden/accessories.png" />
          <div class="overlay">
            <h2>ACCESSORIES</h2>
            <span class="cta">Shop Now</span>
          </div>
        </a>

        <a class="tile" href="productlist.html">
          <img src="img/forsiden/apparel.webp" />
          <div class="overlay">
            <h2>APPAREL</h2>
            <span class="cta">Shop Now</span>
          </div>
        </a>

        <a class="tile" href="productlist.html">
          <img src="img/forsiden/footwear.webp" />
          <div class="overlay">
            <h2>FOOTWEAR</h2>
            <span class="cta">Shop Now</span>
          </div>
        </a>

        <a class="tile" href="productlist.html">
          <img src="img/forsiden/free.webp" />
          <div class="overlay">
            <h2>FREE ITEMS</h2>
            <span class="cta">Shop Now</span>
          </div>
        </a>

        <a class="tile" href="productlist.html">
          <img src="img/forsiden/personal.webp" />
          <div class="overlay">
            <h2>PERSONAL CARE</h2>
            <span class="cta">Shop Now</span>
          </div>
        </a>

        <a class="tile" href="productlist.html">
          <img src="img/forsiden/sport.webp" />
          <div class="overlay">
            <h2>SPORTING GOODS</h2>
            <span class="cta">Shop Now</span>
          </div>
        </a>
      </section>
    </main>
  </body>
</html>
